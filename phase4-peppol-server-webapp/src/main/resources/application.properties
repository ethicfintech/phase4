# Must be "true" for debugging to accept local http connections
global.debug=false
global.production=true
global.nostartupinfo=true
global.datapath=/data/as4

# TEST environment (change to "prod" only after passing PEPPOL conformance testing)
peppol.stage=test

# Your Peppol Seat ID (from your AP certificate CN field: POP001170)
peppol.seatid=POP001170

# UAE country code
peppol.owner.countrycode=AE

# Your Peppol Reporting sender ID
# 0242 = OpenPeppol Service Provider scheme (used for AP/SP identity in reports)
peppol.reporting.senderid=0242:POP001170

# Disable scheduled reporting for now (enable after going live)
peppol.reporting.scheduled=false

# Configure when the Peppol Reporting job runs each month
peppol.reporting.schedule.day-of-month=2
peppol.reporting.schedule.hour=1
peppol.reporting.schedule.minute=0

# Public endpoint of this AP
# LOCAL: use http://localhost:8080/as4
# EC2:   use https://as4.ethicfin.com/as4
phase4.endpoint.address=https://as4.ethicfin.com/as4

# Your SMP URL (set this once you have an SMP registered)
# TODO: uncomment and set when SMP is configured
#smp.url=https://smp.your-domain.com

# Secret token that PHP must send in the X-Token header for every API call
# Change this to something secret before deploying!
phase4.api.requiredtoken=d4ad13cbe6dcf250e6545a8cb65eac613afe011cf36ebbb0e2150726fda7b6f2

# AS4 message dump directory (useful for debugging)
phase4.dump.path=/data/as4/phase4-dumps

# -----------------------------------------------------------------------
# YOUR PEPPOL AP CERTIFICATE (ethicfin-ap-test.p12)
# -----------------------------------------------------------------------
# The .p12 file will be mounted at /certs/ in Docker
org.apache.wss4j.crypto.merlin.keystore.type=PKCS12
org.apache.wss4j.crypto.merlin.keystore.file=/certs/AP_Certificate_pkcs12.p12
org.apache.wss4j.crypto.merlin.keystore.password=4hBUFfrk0iqc
org.apache.wss4j.crypto.merlin.keystore.alias=private_key_for_pkcs12_certificate
org.apache.wss4j.crypto.merlin.keystore.private.password=4hBUFfrk0iqc

# -----------------------------------------------------------------------
# PEPPOL TRUSTSTORES (built-in, no changes needed for TEST)
# -----------------------------------------------------------------------
org.apache.wss4j.crypto.merlin.truststore.type=PKCS12
# Using TEST truststore - switch to ap-prod-truststore.p12 for production
org.apache.wss4j.crypto.merlin.truststore.file=truststore/2025/ap-test-truststore.p12
org.apache.wss4j.crypto.merlin.truststore.password=peppol

# SMP Client truststore
smpclient.truststore.type=PKCS12
smpclient.truststore.path=truststore/2025/smp-test-truststore.p12
smpclient.truststore.password=peppol
